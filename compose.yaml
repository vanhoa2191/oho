name: oho
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oho
      POSTGRES_USER: oho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - oho_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oho -d oho"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
  api:
    build: ./server
    restart: unless-stopped
    environment:
      OHO_DATABASE_URL: ${OHO_DATABASE_URL:?OHO_DATABASE_URL required}
      OHO_AUTH_MODE: ${OHO_AUTH_MODE:-bearer}
      OHO_ADMIN_TOKEN: ${OHO_ADMIN_TOKEN:-}
      OHO_ACCESS_ISSUER: ${OHO_ACCESS_ISSUER:-}
      OHO_ACCESS_AUD: ${OHO_ACCESS_AUD:-}
      OHO_ADMIN_EMAIL: ${OHO_ADMIN_EMAIL:-}
      OHO_ACCESS_JWKS_URL: ${OHO_ACCESS_JWKS_URL:-}
      OHO_ENROLLMENT_TOKEN: ${OHO_ENROLLMENT_TOKEN:?OHO_ENROLLMENT_TOKEN required}
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      retries: 10
  web:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    ports:
      - "127.0.0.1:${OHO_PORT:-8788}:80"
    networks: [internal]
  worker-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    volumes:
      - ./deploy/nginx/worker-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${OHO_WORKER_PORT:-8789}:80"
    networks: [internal]
networks:
  internal:
volumes:
  oho_db:
