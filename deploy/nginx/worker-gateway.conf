# Included in nginx's http context. Expose only node lifecycle routes.
limit_req_zone $binary_remote_addr zone=oho_enroll:10m rate=5r/m;
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;
    limit_req_status 429;
    location = /api/v1/nodes/enroll {
        limit_req zone=oho_enroll burst=2 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location ^~ /api/v1/nodes/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
